name: Build and Deploy to Main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to main
        run: |
          # Save built files to temp directory (before git operations)
          mkdir -p /tmp/main-build
          cp -r dist/index.html /tmp/main-build/ 2>/dev/null || true
          cp -r dist/assets /tmp/main-build/ 2>/dev/null || true
          cp -r dist/templates /tmp/main-build/ 2>/dev/null || true
          cp .nojekyll /tmp/main-build/ 2>/dev/null || true

          # Fetch and checkout main branch
          git fetch origin main
          git checkout main

          # Merge all source changes from the claude branch into main
          # Use -X theirs to auto-resolve conflicts by taking claude branch version
          # (we'll overwrite built files anyway)
          git merge --no-edit -X theirs ${{ github.sha }} -m "Merge source changes from ${{ github.ref_name }}"

          # Overwrite with fresh built files
          rm -rf assets/* 2>/dev/null || true
          rm -rf templates/* 2>/dev/null || true
          cp -r /tmp/main-build/index.html . 2>/dev/null || true
          cp -r /tmp/main-build/assets/* assets/ 2>/dev/null || true
          cp -r /tmp/main-build/templates/* templates/ 2>/dev/null || true
          cp /tmp/main-build/.nojekyll . 2>/dev/null || true

          # Add built files and commit (force-add assets since it's gitignored)
          git add index.html templates .nojekyll
          git add -f assets/
          git diff --staged --quiet || git commit -m "build: Update built assets from ${{ github.ref_name }} @ ${{ github.sha }}"

          # Push to main (GitHub Pages should be configured to serve from main branch)
          git push origin main
