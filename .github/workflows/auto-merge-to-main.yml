name: Auto Merge Claude Branches to Main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build and deploy
        run: |
          npm run build
          # deploy.js already copies index.html and assets to root
          if [ -n "$(git status --porcelain)" ]; then
            git add index.html assets
            git commit -m "Auto-update built files for GitHub Pages"
          fi

      - name: Merge to main
        run: |
          git fetch origin main:main || git checkout -b main
          git checkout main
          git merge --no-ff ${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} to main"
          git push origin main
