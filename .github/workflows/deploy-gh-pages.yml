name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          # Save built files to temp directory
          mkdir -p /tmp/gh-pages-build
          cp -r index.html assets .nojekyll /tmp/gh-pages-build/ 2>/dev/null || true

          # Fetch and checkout gh-pages branch (create if doesn't exist)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clear everything on gh-pages (keep .git directory!)
          git rm -rf . 2>/dev/null || true
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} + 2>/dev/null || true

          # Copy built files from temp
          cp -r /tmp/gh-pages-build/* . 2>/dev/null || true
          cp /tmp/gh-pages-build/.nojekyll . 2>/dev/null || true

          # Add and commit
          git add -A
          git commit -m "Deploy from ${{ github.ref_name }} @ ${{ github.sha }}" || echo "No changes to commit"

          # Push to gh-pages
          git push origin gh-pages --force
