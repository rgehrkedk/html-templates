name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          # Fetch gh-pages branch or create it if it doesn't exist
          git fetch origin gh-pages:gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Switch to gh-pages branch
          git checkout gh-pages || git checkout --orphan gh-pages

          # Remove all files except build artifacts
          git rm -rf . 2>/dev/null || true

          # Copy built files from the working directory (they're gitignored on feature branch)
          git checkout ${{ github.ref_name }} -- index.html assets .nojekyll 2>/dev/null || true

          # Add and commit
          git add -A
          git commit -m "Deploy from ${{ github.ref_name }} @ ${{ github.sha }}" || echo "No changes to commit"

          # Push to gh-pages
          git push origin gh-pages --force
